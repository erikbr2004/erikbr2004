# Featured projects shown as constellation stars
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path
#   arm: 0-2                  — Which galaxy arm to associate with (index)
#   description: "..."        — Short description shown on the card
projects:
  - repo: "erikbr2004/Projeto-Arvore-de-Arquivos"
    arm: 0
    description: "A command-line file system simulator written in pure C. The program reads a list of paths from a text file, reconstructs the complete folder and file hierarchy in memory, and provides an interactive shell with commands modeled after a real terminal."
  - repo: "erikbr2004/Projeto-Machine-e-Deep-Learning"
    arm: 0
    description: "A comparative study between classical feature engineering and end-to-end deep learning on the same problem: multiclass classification of 10 military aircraft models from images."
  - repo: "erikbr2004/Projeto-Banco-de-Dados"
    arm: 1
    description: "A comprehensive relational database design for an educational institution, modeling students, guardians, staff, teachers, classes, subjects, schedules, and assessments. The repository covers the entire lifecycle: modeling, DDL, data loading, server-side business rules, automation, and access control."
  - repo: "erikbr2004/Projeto-Estoque-C"
    arm: 0
    description: "A command-line inventory control system written in pure C (C99). Products are loaded from a text file (product.txt) into an in-memory doubly linked list, where all registration, lookup, and movement operations take place."


# Theme color overrides (optional — defaults to deep space palette)
# All values must be valid hex color codes (#RRGGBB)
theme:
  void: "#080c14"              # Darkest background
  nebula: "#0f1623"            # Card backgrounds
  star_dust: "#1a2332"         # Borders, dividers
  synapse_cyan: "#00d4ff"      # Primary accent (arm color 1)
  dendrite_violet: "#a78bfa"   # Secondary accent (arm color 2)
  axon_amber: "#ffb020"        # Tertiary accent (arm color 3)
  text_bright: "#f1f5f9"       # Primary text
  text_dim: "#94a3b8"          # Secondary text
  text_faint: "#64748b"        # Muted text, labels

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "repos"
    - "stars"
    - "prs"
    - "issues"
    

# Language display settings
languages:
  exclude:                     # Languages to hide from the telemetry chart
     - "HTML"
     - "CSS"
     - "Shell"
     - "Makefile"
     - "CMake"
  max_display: 5              # Maximum number of languages to show
